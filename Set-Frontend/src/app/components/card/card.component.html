<!-- Card component template -->
@if (card) {
    <div class="card" [class.selected]="selected">
      @for (i of shapeArray; track i) {
        <svg viewBox="0 0 150 120" width="80px" height="60px">
          <use [attr.href]="shapeHref"
               [attr.stroke]="strokeValue"
               [attr.fill]="fillValue"/>
        </svg>
      }
    </div>
} @else {
  <div class="card" style="border: 0px; background: transparent;"></div>
}
