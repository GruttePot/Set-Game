<!-- Found set component template -->
<div class="set">
  <div class="set-cards">
    <card [card]="foundSet.card1" [selected]="false"/>
    <card [card]="foundSet.card2" [selected]="false"/>
    <card [card]="foundSet.card3" [selected]="false"/>
  </div>
  <span class="set-time">{{ foundSet.foundAt | date:'shortTime' }}</span>
</div>
