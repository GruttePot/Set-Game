<div class="game-container">
  <!-- Header met acties -->
  <div class="game-header">
    <h1 class="game-title">Set Game</h1>

    <div class="game-stats">
      <div class="stat-item">
        <span class="stat-label">Hints Left:</span>
        <span class="stat-value">{{ gameService.hints() }}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Found Sets:</span>
        <span class="stat-value">{{ gameService.foundSets() }}</span>
      </div>
    </div>
  </div>

  <!-- Main game board met cards -->
  <div class="board-container">
    <div class="card-grid">
      @for (card of gameService.tableCards().slice(0,12); track card.id) {
        <div
          class="card-wrapper"
          (click)="selectedCard(card)"
          [class.selected]="card.selected || false"
          [class.hinted]="card.hinted || false">
          <card
            [card]="card"
            [selected]="card.selected || false"/>
        </div>
      } @empty {
        <p class="empty-state">No cards available</p>
      }
    </div>
  </div>

  <!-- Action buttons -->
  <div class="action-buttons">
    <button
      class="btn btn-primary"
      (click)="showHint()"
      [disabled]="gameService.hints() <= 0">
      Get Hint
    </button>
    <button
      class="btn btn-secondary"
      (click)="returnHome()">
      Quit Game
    </button>
    <button
      class="btn btn-danger"
      (click)="deleteGame()">
      Delete Game
    </button>
  </div>
</div>
